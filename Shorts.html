<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Shorts — Filmes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
    }
    .shorts-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <!--
    Troque a URL abaixo pela URL real do seu Worker
    (ex: https://seu-worker.seu-usuario.workers.dev/)
  -->
  <iframe
    class="shorts-frame"
    src="https://reproduvideocurto.canalpedroid.workers.dev/"
    allow="autoplay; encrypted-media; picture-in-picture; clipboard-write"
    allowfullscreen
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

</body>
</html>
